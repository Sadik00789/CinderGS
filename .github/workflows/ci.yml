name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux WGPU/Winit)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libasound2-dev libudev-dev pkg-config libvulkan-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Cargo Clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libasound2-dev libudev-dev libvulkan-dev

      - name: Setup DXC for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dxc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10" -Recurse -Filter "dxcompiler.dll" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
          if ($dxc) {
            $dxcDir = $dxc.DirectoryName
            Write-Host "Found DXC in Windows Kits: $dxcDir"
            Copy-Item "$dxcDir\dxcompiler.dll" -Destination "."
            Copy-Item "$dxcDir\dxil.dll" -Destination "." -ErrorAction SilentlyContinue
            echo "$dxcDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            Write-Host "Downloading DXC release fallback..."
            $dxcDir = "$env:TEMP\dxc"
            New-Item -ItemType Directory -Force -Path $dxcDir | Out-Null
            $url = "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.8.2502/dxc_2025_02_28.zip"
            Invoke-WebRequest -Uri $url -OutFile "$dxcDir\dxc.zip"
            Expand-Archive -Path "$dxcDir\dxc.zip" -DestinationPath $dxcDir -Force
            Copy-Item "$dxcDir\bin\x64\dxcompiler.dll" -Destination "."
            Copy-Item "$dxcDir\bin\x64\dxil.dll" -Destination "." -ErrorAction SilentlyContinue
            echo "$dxcDir\bin\x64" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          echo "WGPU_DX12_COMPILER=dxc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Test Suite
        run: cargo test --all-targets --verbose

  build:
    name: Release Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libasound2-dev libudev-dev libvulkan-dev

      - name: Setup DXC for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dxc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10" -Recurse -Filter "dxcompiler.dll" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
          if ($dxc) {
            $dxcDir = $dxc.DirectoryName
            Write-Host "Found DXC in Windows Kits: $dxcDir"
            Copy-Item "$dxcDir\dxcompiler.dll" -Destination "."
            Copy-Item "$dxcDir\dxil.dll" -Destination "." -ErrorAction SilentlyContinue
            echo "$dxcDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            Write-Host "Downloading DXC release fallback..."
            $dxcDir = "$env:TEMP\dxc"
            New-Item -ItemType Directory -Force -Path $dxcDir | Out-Null
            $url = "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.8.2502/dxc_2025_02_28.zip"
            Invoke-WebRequest -Uri $url -OutFile "$dxcDir\dxc.zip"
            Expand-Archive -Path "$dxcDir\dxc.zip" -DestinationPath $dxcDir -Force
            Copy-Item "$dxcDir\bin\x64\dxcompiler.dll" -Destination "."
            Copy-Item "$dxcDir\bin\x64\dxil.dll" -Destination "." -ErrorAction SilentlyContinue
            echo "$dxcDir\bin\x64" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          echo "WGPU_DX12_COMPILER=dxc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binaries
        run: cargo build --release

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinder_gs-${{ matrix.os }}
          path: |
            target/release/cinder_gs
            target/release/cinder_gs.exe
            target/release/benchmark
            target/release/benchmark.exe
            target/release/render
            target/release/render.exe
            target/release/record_demo
            target/release/record_demo.exe
          if-no-files-found: ignore
