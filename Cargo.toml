[package]
name = "cinder_gs"
version = "0.1.0"
edition = "2024"
authors = ["CinderGS Engine Team"]
description = "High-performance production-grade 3D Gaussian Splatting engine core"

[dependencies]
glam = "0.28"
bytemuck = { version = "1.18", features = ["derive", "min_const_generics"] }
memmap2 = "0.9"
anyhow = "1.0"
thiserror = "1.0"
rayon = "1.10"
cubecl = { version = "0.11.0", features = ["wgpu"] }
cubecl-common = "0.11.0"
winit = { version = "0.30", features = ["rwh_06"] }
egui = "0.28"
egui-winit = "0.28"
egui-wgpu = "0.28"
wgpu = "0.20"
pollster = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }




[dev-dependencies]
tempfile = "3.10"
